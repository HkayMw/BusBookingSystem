
name: CI

on:
  push:
  # Left the branch filter commented out to allow all branches to trigger the workflow
    # branches:
    #   - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BusBookingSystem.slnx
      - run: dotnet build BusBookingSystem.slnx --no-restore --configuration Release
      - run: dotnet test BusBookingSystem.slnx --no-build --configuration Release